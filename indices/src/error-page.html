<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larder | Error {{ error.code }}</title>
    <link href="/_internal/index-page.css" rel="stylesheet">
</head>
<body>
<div class="bg-slate-200 text-slate-900 w-100% h-100% min-h-dvh">
    <div class="w-full flex justify-center min-h-dvh align-items-center">
        <div class="w-2/3 h-full flex flex-col gap-5 p-5">
            <div class=" shadow-sm rounded-md block flex flex-col bg-red-300 p-5">
                <div class="text-red-800 text-xl">
                    {{ error.code }}: {{ error.error }}
                </div>
                {% if error.details.message is not null %}
                <div class="text-red-800">
                    {{ error.details.message }}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
