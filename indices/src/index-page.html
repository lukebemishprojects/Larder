<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index of {{ path }}</title>
  <link href="/_internal/index-page.css" rel="stylesheet">
</head>
<body>
  <div class="bg-slate-200 text-slate-900 w-dvw h-dvh">
    <div class="w-full h-full flex flex-col gap-5 p-5">
      <div class="w-full flex flex-row gap-5 items-center">
        <h1 class="text-5xl">{{ path }}</h1>
        <div class="flex-1"></div>
          <a href="/dashboard/" style="display:none;" id="show-dashboard" class="justify-center py-2 px-3 rounded-md bg-white font-semibold border-1 hover:bg-slate-150">
              Dashboard
          </a>
          <a style="display:none;" id="sign-in" class="justify-center py-2 px-3 rounded-md bg-white font-semibold border-1 hover:bg-slate-150">
              Sign In
          </a>
          <a href="/dashboard/logout/" style="display:none;" id="sign-out" class="justify-center py-2 px-3 rounded-md bg-white font-semibold border-1 hover:bg-slate-150">
              Sign Out
          </a>
      </div>
      <div class="w-full h-0 border-b-2"></div>
      <div class="w-full h-full flex flex-col gap-2.5 overflow-auto">
{% for entry in entries %}
      <a href="{{ entry.name }}" class="bg-white shadow-sm bg-slate-150 rounded-lg p-2.5 block">
      <div class="flex flex-row gap-5 items-center">
        <div class="">{{ entry.name }}</div>
        <div class="flex-1"></div>
        <div class="w-1/3">
          <div class="flex flex-row gap-5 items-center">
            <div class="font-mono text-xs text-slate-600">{{ entry.humanDatetime }}</div>
            <div class="flex-1"></div>
            <div class="font-mono text-xs text-slate-600">{{ entry.humanSize }}</div>
          </div>
        </div>
      </div>
      </a>
{% endfor %}
      </div>
    </div>
  </div>
  <script language="javascript">
      fetch("/dashboard/api/whatcanido").then((response) => {if (response.status === 401) {
          document.getElementById("sign-in").style.display = "inline-block";
          document.getElementById("sign-in").href = "/signin?target="+window.btoa(window.location.pathname)
      } else {
          document.getElementById("show-dashboard").style.display = "inline-block";
          document.getElementById("sign-out").style.display = "inline-block";
      }});
  </script>
</body>
</html>
