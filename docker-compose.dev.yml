services:
  minio:
    container_name: minio
    image: minio/minio:latest
    restart: on-failure
    ports:
      - "9000:9000"
      - "9001:9001"
    command: "minio server --console-address 0.0.0.0:9001 /data"
    volumes:
      - type: bind
        source: ./build/dev/minio/
        target: /data

  larder-postgres:
    container_name: larder-postgres
    image: postgres:17-alpine
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: larder
      POSTGRES_PASSWORD: larder
      POSTGRES_DB: larder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larder"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - type: bind
        source: ./build/dev/larder-postgres/
        target: /var/lib/postgresql/data

  nanoidp:
    container_name: nanoidp
    image: ghcr.io/cdelmonte-zg/nanoidp:v2.5.0
    restart: on-failure
    ports:
      - "8282:8282"
    environment:
      PORT: "8282"
    volumes:
      - type: bind
        source: ./test-oidc
        target: /app/config/
